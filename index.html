<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>StreakBoard - gamified sports activity tracker</title>
<link rel="stylesheet" href="style.css"></head>
<body>
<main>
<header><h1>StreakBoard</h1><p class="sub">Log real-world sports sessions. Earn XP, keep your streak, level up.</p></header>
<section class="stats" aria-live="polite">
<div class="card"><span id="level" class="big">1</span><label>Level</label></div>
<div class="card"><span id="xp" class="big">0</span><label>Total XP</label></div>
<div class="card"><span id="streak" class="big">0</span><label>Day streak</label></div>
</section>
<div class="bar"><div id="progress"></div></div><p id="next" class="hint"></p>
<form id="log" class="card">
<select id="sport" aria-label="Sport"><option>Cricket</option><option>Football</option><option>Badminton</option><option>Running</option><option>Basketball</option><option>Tennis</option></select>
<input id="mins" type="number" min="5" max="300" value="45" aria-label="Minutes">
<input id="date" type="date" aria-label="Date">
<button type="submit">Log session</button>
</form>
<p id="err" class="err" role="alert"></p>
<h2>Badges</h2><ul id="badges" class="badges"></ul>
<h2>History</h2><ul id="history"></ul>
<button id="reset" class="ghost">Reset data</button>
</main>
<script src="engine.js"></script><script src="app.js"></script>
</body></html>
